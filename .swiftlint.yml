excluded:
  - .build
  # Generated by XcodeGen, never edited by hand.
  - Examples/SankeyDemo/SankeyDemo.xcodeproj

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - todo

identifier_name:
  allowed_symbols: ["_"]
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 60
    error: 80

type_name:
  max_length:
    warning: 50
    error: 60

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 80
  error: 140

function_parameter_count:
  warning: 8
  error: 10

large_tuple:
  warning: 4
  error: 6

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 3
